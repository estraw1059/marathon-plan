<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Running woman" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="64" height="64" rx="14" fill="#1a2e4a"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ponytail, swinging behind -->
    <path d="M31 11.5C24.5 8.5 20 12 21 18.5" stroke="#ffb4a2" stroke-width="3.6"/>
    <!-- arms -->
    <path d="M34 25L42.5 31L47 24" stroke="#fff" stroke-width="4.6"/>
    <path d="M34 25L26 28.5L21 35" stroke="#fff" stroke-width="4.6"/>
    <!-- torso -->
    <path d="M34.5 22.5L28.5 38" stroke="#fff" stroke-width="6.4"/>
    <!-- legs: lead knee up, trailing foot kicked back -->
    <path d="M28.5 38L39.5 42.5L37 55" stroke="#fff" stroke-width="5.2"/>
    <path d="M28.5 38L21.5 47.5L10.5 45" stroke="#fff" stroke-width="5.2"/>
  </g>
  <!-- head -->
  <circle cx="36.5" cy="14.5" r="6.6" fill="#fff"/>
</svg>
